<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meus Animais - Studio de Beleza Animal</title>
    <link rel="stylesheet" href="../Site/Css/global/variables.css" />
    <link rel="stylesheet" href="../Site/Css/pages/animais/animaistyle.css" />
    <link rel="stylesheet" href="../Site/Css/global/style.css" />
    <link rel="stylesheet" href="../Site/Css/global/screens.css" />
  </head>
  <body>
    <h1 class="h1form">Studio de Beleza Animal</h1>
    <main>
      <form id="formAnimal">
        <h2 class="h2form">Meus Animais</h2>
        <p class="pform">Cadastrar Animal</p>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" required />

        <label for="especie">Espécie:</label>
        <select id="especie" required>
          <option value="">Selecione</option>
          <option value="Cachorro">Cachorro</option>
          <option value="Gato">Gato</option>
        </select>

        <label for="raca">Raça:</label>
        <input type="text" id="raca" required />

        <label for="porte">Porte:</label>
        <select id="porte" required>
          <option value="">Selecione</option>
          <option value="P">Pequeno</option>
          <option value="M">Médio</option>
          <option value="G">Grande</option>
        </select>

        <button type="submit">Cadastrar Animal</button>
      </form>

      <h2 class="h2form">Animais Cadastrados</h2>
      <div id="listaAnimais"></div>

      <p><a href="../Site/clientearea.html">Voltar para Área do Cliente</a></p>

      <script src="../Site/Js/animais.js"></script>
    </main>
  </body>
</html>
