
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - Studio de Beleza Animal</title>
    <link rel="stylesheet" href="Css/global/variables.css">
    <link rel="stylesheet" href="Css/global/style.css">
    <link rel="stylesheet" href="Css/pages/perfil/perfilstyle.css">
</head>
<body>

    <h1 class="h1form">Meu Perfil</h1>

    <main>
        <!-- Formulário com os dados do cliente. -->
        <form id="formPerfil">
            <h2 class="h2form">Meus Dados</h2>
            <p class="pform">
                Consulte e atualize suas informações pessoais.
            </p>
            <label for="nome">Nome completo</label>
            <input
                type="text"
                id="nome"
                name="nome"
                autocomplete="name"
                required
            >

            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                required
            >

            <label for="telefone">Telefone</label>
            <input
                type="tel"
                id="telefone"
                name="telefone"
                autocomplete="tel"
            >

            <button type="submit" id="salvarPerfil">
                Salvar Alterações
            </button>

            <p id="mensagemPerfil" role="status" aria-live="polite"></p>

        </form>

        <!-- Área para alteração de senha. -->
        <h2>Segurança</h2>

        <p>
            Deseja alterar sua senha?
        </p>

        <button type="button" id="botaoAlterarSenha">
            Alterar Senha
        </button>

        <form id="formSenha" hidden>

            <label for="senhaAtual">Senha atual</label>
            <input
                type="password"
                id="senhaAtual"
                name="senhaAtual"
                autocomplete="current-password"
                required
            >

            <label for="novaSenha">Nova senha</label>
            <input
                type="password"
                id="novaSenha"
                name="novaSenha"
                autocomplete="new-password"
                required
            >

            <label for="confirmarSenha">Confirmar nova senha</label>
            <input
                type="password"
                id="confirmarSenha"
                name="confirmarSenha"
                autocomplete="new-password"
                required
            >
            
            <button type="submit">
                Salvar Nova Senha
            </button>

            <p id="mensagemSenha" role="status" aria-live="polite"></p>
        </form>

        <!-- Navegação para a área do cliente. -->
        <nav>
            <a href="cliente.html">Voltar para Minha Conta</a>  
            <a href="index.html">Página Inicial</a>
        </nav>
    </main>

    <script src="Js/perfil.js"></script>
</body>
</html>
