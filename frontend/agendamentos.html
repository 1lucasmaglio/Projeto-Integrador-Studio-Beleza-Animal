
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamentos - Studio de Beleza Animal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Studio de Beleza Animal</h1>
    <h2>Agendamentos</h2>

    <main>
        <h3>Agendar Serviço</h3>

        <form id="formAgendamento">
            <label for="animal">Animal:</label>
            <select id="animal" required>
                <option value="">Selecione um animal</option>
            </select>

            <label for="servico">Serviço:</label>
            <select id="servico" required>
                <option value="">Selecione um serviço</option>
            </select>
            <p id="precoServico"></p>

            <label for="data">Data:</label>
            <input type="date" id="data" required>
            <p>Funcionamento: terça a sexta-feira, das 07h às 18h.</p>

            <label for="hora">Horário:</label>
            <select id="hora" required>
                <option value="">Selecione um horário</option>
                <option value="07:00">07:00</option>
                <option value="08:00">08:00</option>
                <option value="09:00">09:00</option>
                <option value="10:00">10:00</option>
                <option value="11:00">11:00</option>
                <option value="12:00">12:00</option>
                <option value="13:00">13:00</option>
                <option value="14:00">14:00</option>
                <option value="15:00">15:00</option>
                <option value="16:00">16:00</option>
                <option value="17:00">17:00</option>
            </select>

            <label for="levaETraz">
                <input type="checkbox" id="levaETraz">
                Leva e Traz (+R$10,00)
            </label>

            <button type="submit">Agendar Serviço</button>
            <p id="mensagemAgendamento" role="status" aria-live="polite"></p>
        </form>

        <p><a href="cliente.html">Voltar para Área do Cliente</a></p>
    </main>

    <script src="agendamentos.js"></script>
</body>
</html>
